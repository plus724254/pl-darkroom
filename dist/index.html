<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="在瀏覽器內套用 F 系列或 R 系列濾鏡、調整色彩、裁切並下載照片。">
  <meta name="theme-color" content="#f6f5ee">
  <title>光影暗房</title>
  <link rel="stylesheet" href="./styles.css">
  <script defer src="./assets/taipei-sample.js"></script>
  <script defer src="./grade.js"></script>
  <script defer src="./grain.js"></script>
  <script defer src="./crop.js"></script>
  <script defer src="./app.js"></script>
</head>
<body>
  <main>
    <section id="chooser" class="chooser" aria-labelledby="title">
      <div class="chooser-content">
        <i class="brand-mark" aria-hidden="true"><span></span></i>
        <h1 id="title">光影暗房<span>.</span></h1>
        <p class="privacy"><i aria-hidden="true"></i>照片僅在裝置上處理</p>

        <div class="dropzone" id="dropzone">
          <input type="file" id="file-input" aria-label="選擇照片" aria-describedby="input-formats" accept=".jpg,.jpeg,.jfif,.png,.webp,.avif,.gif,.bmp,.heic,.heif,image/jpeg,image/png,image/webp,image/avif,image/gif,image/bmp,image/heic,image/heif">
          <span class="upload-icon" aria-hidden="true">↑</span>
          <span class="upload-action">選擇照片</span>
          <span id="input-formats" class="upload-formats">JPEG、PNG、WebP、HEIC 等</span>
        </div>
        <div class="chooser-actions">
          <button id="sample-button" class="secondary-button" type="button">使用示範照</button>
          <button id="return-editor" class="secondary-button" type="button" hidden>繼續編輯</button>
        </div>
        <p id="chooser-status" class="notice" role="status"></p>
      </div>
      <footer class="chooser-footer">
        <a href="./third-party-licenses.html">第三方授權 · HEIC 解碼器（LGPL）</a>
      </footer>
    </section>

    <section id="editor" class="editor" aria-labelledby="preview-title" hidden>
      <header class="editor-header">
        <button id="back-to-chooser" class="editor-back" type="button"><span aria-hidden="true">←</span> 換照片</button>
        <div class="editor-photo-info">
          <h2 id="preview-title">
            <button id="open-preview" class="preview-title-button" type="button" aria-haspopup="dialog" aria-controls="preview-dialog" aria-label="照片預覽，放大照片" disabled>
              <i class="focus-icon" aria-hidden="true"></i>照片預覽
            </button>
          </h2>
          <p id="file-label" class="file-label"></p>
        </div>
        <p id="dimensions" class="dimensions"></p>
      </header>
      <div id="stage" class="stage" aria-busy="false">
        <p id="stage-message" class="stage-message" role="status" hidden></p>
        <div id="comparison" class="comparison" hidden>
          <div id="photo" class="photo">
            <div class="photo-layer edited-layer">
              <canvas id="graded" aria-label="編輯後的照片" role="img"></canvas>
              <span class="image-label after" aria-hidden="true">編輯後</span>
            </div>
            <div class="photo-layer original-layer">
              <canvas id="original" aria-label="套用色彩前的照片" role="img"></canvas>
              <span class="image-label before" aria-hidden="true">原圖</span>
            </div>
            <div class="divider" aria-hidden="true"><span>‹&nbsp; ›</span></div>
            <input id="split" class="compare-range" type="range" min="0" max="100" value="50" aria-label="原圖顯示比例" hidden>
            <button id="hold-original" class="hold-original" type="button" aria-label="按住顯示原圖"></button>
          </div>
          <div id="held-preview" class="held-preview" hidden>
            <canvas id="held-original" role="img" aria-label="未編輯的原始照片"></canvas>
            <span class="image-label before" aria-hidden="true">原圖</span>
          </div>
        </div>
      </div>

      <div id="tool-dock" class="tool-dock">
        <section id="filter-panel" class="tool-panel filter-panel" aria-labelledby="filter-tool" tabindex="-1" hidden>
          <div class="filter-picker">
            <fieldset id="filter-series" class="preview-modes filter-series">
              <legend class="sr-only">濾鏡系列</legend>
              <label><input type="radio" name="filter-series" value="f" checked><span>F Series</span></label>
              <label><input type="radio" name="filter-series" value="r"><span>R Series</span></label>
            </fieldset>
            <fieldset class="setting preset-field" id="preset" aria-describedby="preset-note">
              <legend class="sr-only">濾鏡風格</legend>
              <div class="preset-options">
                <label class="preset-option">
                  <input type="radio" name="preset" value="none" data-note="未套用濾鏡。" checked>
                  <span class="preset-tile">無</span>
                </label>
                <label class="preset-option" data-series="f">
                  <input type="radio" name="preset" value="positive" data-note="色彩柔和，暗部對比較深，帶有紀實感。">
                  <span class="preset-tile">紀實正片</span>
                </label>
                <label class="preset-option" data-series="f">
                  <input type="radio" name="preset" value="negative" data-note="暗部對比鮮明，亮部偏暖，綠藍色彩較收斂。">
                  <span class="preset-tile">暖影負片</span>
                </label>
                <label class="preset-option" data-series="f">
                  <input type="radio" name="preset" value="standard" data-note="色彩自然，明暗對比適中。">
                  <span class="preset-tile">標準／通用</span>
                </label>
                <label class="preset-option" data-series="f">
                  <input type="radio" name="preset" value="color-effect" data-note="加深高飽和紅、黃、綠色的層次。">
                  <span class="preset-tile">彩色效果</span>
                </label>
                <label class="preset-option" data-series="f">
                  <input type="radio" name="preset" value="velvia" data-note="讓天空和植被更鮮豔，暗部對比更深。">
                  <span class="preset-tile">濃彩風景</span>
                </label>
                <label class="preset-option" data-series="f">
                  <input type="radio" name="preset" value="astia" data-note="膚色階調柔和，保留藍天與綠植的發色。">
                  <span class="preset-tile">柔光人像</span>
                </label>
                <label class="preset-option" data-series="f">
                  <input type="radio" name="preset" value="reala-ace" data-note="色彩自然，暖色較收斂，亮部對比清晰。">
                  <span class="preset-tile">清透日光</span>
                </label>
                <label class="preset-option" data-series="f">
                  <input type="radio" name="preset" value="pro-neg-hi" data-note="保留自然膚色，加深人像的陰影與輪廓。">
                  <span class="preset-tile">深影人像</span>
                </label>
                <label class="preset-option" data-series="f">
                  <input type="radio" name="preset" value="pro-neg-std" data-note="對比較柔和，膚色與暗部過渡平順。">
                  <span class="preset-tile">柔階人像</span>
                </label>
                <label class="preset-option" data-series="f">
                  <input type="radio" name="preset" value="nostalgic-neg" data-note="亮部偏琥珀色，暗部保留色彩，帶有懷舊相紙的色調。">
                  <span class="preset-tile">琥珀相紙</span>
                </label>
                <label class="preset-option" data-series="f">
                  <input type="radio" name="preset" value="eterna" data-note="低彩度、柔和對比，讓亮部與暗部的過渡更平順。">
                  <span class="preset-tile">柔調電影</span>
                </label>
                <label class="preset-option" data-series="f">
                  <input type="radio" name="preset" value="eterna-bleach-bypass" data-note="保留少量色彩並強化明暗對比，呈現電影漂白旁路的效果。">
                  <span class="preset-tile">銀灰電影</span>
                </label>
                <label class="preset-option" data-series="f">
                  <input type="radio" name="preset" value="acros" data-note="黑白底片風格，保留暗部階調。">
                  <span class="preset-tile">銀鹽黑白</span>
                </label>
                <label class="preset-option" data-series="f">
                  <input type="radio" name="preset" value="acros-red" data-note="紅色濾鏡讓藍天更深、紅色物體更亮，拉出黑白對比。">
                  <span class="preset-tile">紅鏡黑白</span>
                </label>
                <label class="preset-option" data-series="f">
                  <input type="radio" name="preset" value="sepia" data-note="將照片轉為暖棕色單色調，呈現舊相紙的色澤。">
                  <span class="preset-tile">暖棕相紙</span>
                </label>
                <label class="preset-option" data-series="r" hidden>
                  <input type="radio" name="preset" value="r-positive" data-note="暗部和中間調較深，紅色濃郁，藍色偏冷。">
                  <span class="preset-tile">正片</span>
                </label>
                <label class="preset-option" data-series="r" hidden>
                  <input type="radio" name="preset" value="r-negative" data-note="中間調較亮，紅色偏橘，藍色柔和，綠色偏青。">
                  <span class="preset-tile">負片</span>
                </label>
              </div>
              <p class="style-note" id="preset-note">未套用濾鏡。</p>
            </fieldset>
          </div>

          <div class="setting strength-setting">
            <div class="grain-toolbar">
              <div id="strength-label" class="label-row"><label class="field-label" for="strength">濾鏡強度</label><output id="strength-value" for="strength">100%</output></div>
              <button id="grain-toggle" class="grain-button grain-toggle" type="button" aria-controls="grain-controls" aria-expanded="false">底片顆粒 <span id="grain-status">關閉</span></button>
              <button id="grain-reset" class="grain-button" type="button" disabled hidden>還原預設</button>
            </div>
            <input id="strength" class="editor-range" type="range" min="0" max="100" value="100" disabled>
            <div id="grain-controls" class="grain-controls" role="group" aria-label="底片顆粒設定" hidden>
              <div class="select-box">
                <select id="grain-strength" aria-label="顆粒強度">
                  <option value="off">關閉</option>
                  <option value="weak">弱顆粒</option>
                  <option value="strong">強顆粒</option>
                </select>
              </div>
              <div class="select-box">
                <select id="grain-size" aria-label="顆粒大小" disabled>
                  <option value="fine">細顆粒</option>
                  <option value="coarse">粗顆粒</option>
                </select>
              </div>
            </div>
          </div>
        </section>

        <section id="adjust-panel" class="tool-panel" aria-labelledby="adjust-tool" tabindex="-1" hidden>
          <div class="adjustment-fields">
            <div>
              <div class="label-row"><label class="field-label" for="brightness">亮度</label><output id="brightness-value" for="brightness">0</output></div>
              <input id="brightness" class="editor-range" type="range" min="-100" max="100" value="0">
            </div>
            <div>
              <div class="label-row"><label class="field-label" for="temperature">色溫</label><output id="temperature-value" for="temperature">0</output></div>
              <input id="temperature" class="editor-range" type="range" min="-100" max="100" value="0">
            </div>
            <div>
              <div class="label-row"><label class="field-label" for="saturation">飽和度</label><output id="saturation-value" for="saturation">0</output></div>
              <input id="saturation" class="editor-range" type="range" min="-100" max="100" value="0">
            </div>
            <button id="reset-adjustments" class="secondary-button" type="button">重設色彩</button>
          </div>
        </section>

        <section id="compare-panel" class="tool-panel" aria-labelledby="compare-tool" tabindex="-1" hidden>
          <fieldset id="preview-mode" class="preview-modes">
            <legend class="sr-only">預覽模式</legend>
            <label><input type="radio" name="preview-mode" value="direct" data-hint="按住照片看原圖" checked><span>直接顯示</span></label>
            <label><input type="radio" name="preview-mode" value="split" data-hint="拖曳照片上的拉桿比較"><span>拉桿比較</span></label>
            <label><input type="radio" name="preview-mode" value="side" data-hint="點一下任一張照片可放大"><span>並排檢視</span></label>
          </fieldset>
          <p id="compare-hint" class="style-note">按住照片看原圖</p>
        </section>

        <section id="export-panel" class="tool-panel" aria-labelledby="export-tool" tabindex="-1" hidden>
          <div class="export-group">
            <label class="field-label" for="export-size">下載尺寸</label>
            <div class="select-box size-box">
              <select id="export-size">
                <option value="full">原始尺寸</option>
                <option value="social">社群版 · 壓縮 JPG</option>
              </select>
            </div>
            <p id="export-dimensions" class="export-note"></p>
            <div class="export-controls">
              <div class="select-box format-box" id="format-box"><select id="format" aria-label="下載格式"><option value="image/jpeg">JPG</option><option value="image/png">PNG</option><option value="image/webp">WebP</option></select></div>
              <button id="download" class="download" type="button" disabled><span class="download-icon" aria-hidden="true">↓</span><span id="download-label">下載照片</span></button>
            </div>
            <p id="notice" class="notice" role="status" aria-live="polite"></p>
          </div>
        </section>

        <div class="tool-bar" role="group" aria-label="編輯工具">
          <button id="filter-tool" class="tool-button" type="button" aria-controls="filter-panel" aria-expanded="false"><i class="tool-icon tool-filter" aria-hidden="true"></i>濾鏡</button>
          <button id="adjust-tool" class="tool-button" type="button" aria-controls="adjust-panel" aria-expanded="false"><i class="tool-icon tool-adjust" aria-hidden="true"></i>調整</button>
          <button id="open-crop" class="tool-button" type="button" aria-label="裁切與旋轉" aria-haspopup="dialog" aria-controls="crop-dialog" disabled><i class="tool-icon tool-crop" aria-hidden="true"></i>裁切</button>
          <button id="compare-tool" class="tool-button" type="button" aria-controls="compare-panel" aria-expanded="false"><i class="tool-icon tool-compare" aria-hidden="true"></i>比較</button>
          <button id="export-tool" class="tool-button" type="button" aria-controls="export-panel" aria-expanded="false"><i class="tool-icon tool-export" aria-hidden="true"></i>輸出</button>
        </div>
      </div>
    </section>
  </main>

  <dialog id="preview-dialog" class="preview-dialog" aria-label="全螢幕照片預覽">
    <button id="close-preview" class="close-preview" type="button" aria-label="縮回照片">
      <canvas id="fullscreen-photo" aria-hidden="true"></canvas>
      <span class="close-preview-icon" aria-hidden="true">×</span>
    </button>
  </dialog>

  <dialog id="crop-dialog" class="crop-dialog" aria-labelledby="crop-title">
    <header class="panel-title">
      <h2 id="crop-title">裁切與旋轉</h2>
      <button id="cancel-crop" class="secondary-button" type="button">取消</button>
    </header>
    <div class="crop-content">
      <div class="crop-stage">
        <div id="crop-photo" class="crop-photo">
          <canvas id="crop-canvas" aria-label="裁切預覽" role="img"></canvas>
          <div id="crop-selection" class="crop-selection" tabindex="0" aria-label="裁切範圍，使用方向鍵移動">
            <button class="crop-handle" data-corner="nw" type="button" aria-label="左上角，使用方向鍵調整"></button>
            <button class="crop-handle" data-corner="ne" type="button" aria-label="右上角，使用方向鍵調整"></button>
            <button class="crop-handle" data-corner="sw" type="button" aria-label="左下角，使用方向鍵調整"></button>
            <button class="crop-handle" data-corner="se" type="button" aria-label="右下角，使用方向鍵調整"></button>
          </div>
        </div>
      </div>
      <div class="crop-tools">
        <div class="select-box">
          <select id="crop-ratio" aria-label="裁切比例">
            <option value="free">自由比例</option><option value="1:1">1:1</option>
            <option value="4:5">4:5</option><option value="5:4">5:4</option>
            <option value="3:2">3:2</option><option value="2:3">2:3</option>
            <option value="16:9">16:9</option><option value="9:16">9:16</option>
          </select>
        </div>
        <button id="rotate-left" class="secondary-button" type="button" aria-label="向左旋轉 90 度">↶ 90°</button>
        <button id="rotate-right" class="secondary-button" type="button" aria-label="向右旋轉 90 度">↷ 90°</button>
      </div>
      <div class="crop-actions">
        <button id="reset-crop" class="secondary-button" type="button">重設</button>
        <button id="apply-crop" class="download" type="button">套用</button>
      </div>
    </div>
  </dialog>
</body>
</html>
